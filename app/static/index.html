<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Support Engineer</title>
<style>
body{font-family:system-ui;max-width:900px;margin:50px auto;padding:0 20px}
textarea{width:100%;height:140px;padding:12px;font-size:16px}
button{margin-top:12px;padding:10px 18px;font-size:16px;cursor:pointer}
pre{white-space:pre-wrap;background:#f5f5f5;padding:18px;border-radius:10px}
</style>
</head>
<body>
<h1>AI Support Engineer</h1>
<p>Describe a software issue. The agent retrieves documentation and searches the sample codebase.</p>
<textarea id="issue" placeholder="My POST /users endpoint returns a 500 when the email already exists."></textarea>
<br>
<button onclick="run()">Diagnose</button>
<pre id="out">Result will appear here...</pre>
<script>
async function run(){
  const issue=document.getElementById("issue").value;
  const out=document.getElementById("out");
  out.textContent="Agent is investigating...";
  try{
    const r=await fetch("/support",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({issue})
    });
    out.textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){out.textContent=e.toString();}
}
</script>
</body>
</html>
